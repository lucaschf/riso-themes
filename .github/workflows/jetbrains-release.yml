name: JetBrains release

# Push a tag that matches jetbrains/gradle.properties' pluginVersion
# (e.g. jetbrains-v0.1.3) to publish the plugin to the JetBrains Marketplace.
# The VS Code release (release.yml) only runs on v* tags.
on:
  push:
    tags: ["jetbrains-v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches gradle.properties
        run: |
          version=$(sed -n 's/^pluginVersion=//p' jetbrains/gradle.properties | tr -d '[:space:]')
          if [ "jetbrains-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion $version in jetbrains/gradle.properties."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # This version's entry in the plugin's <change-notes>, which the
      # Marketplace shows as "What's new": from "<p><b>0.1.2</b></p>" to the
      # next version's heading, as Markdown bullets for the GitHub release.
      - name: Extract the release notes from the change notes
        run: |
          awk -v v="<p><b>$VERSION</b></p>" 'index($0, v) { on = 1; next } /<p><b>|]]>/ { on = 0 } on' jetbrains/plugin.template.xml \
            | tr '\n' ' ' | sed -e 's/<li>/\n- /g' -e 's/<[^>]*>//g' -e 's/  */ /g' -e 's/ *$//' | sed '/^ *$/d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::jetbrains/plugin.template.xml has no <p><b>$VERSION</b></p> entry in <change-notes> — add one before tagging."
            exit 1
          fi
          cat notes.md

      - name: Generate the themes (fails on the contrast audit)
        run: npm run build

      - name: Check the generated files are committed
        run: |
          if ! git diff --exit-code -- jetbrains/src; then
            echo "::error::Generated files are out of date — run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Build the plugin
        working-directory: jetbrains
        run: ./gradlew buildPlugin verifyPluginStructure --console=plain

      - name: Publish to the JetBrains Marketplace
        working-directory: jetbrains
        run: |
          # A pasted token can carry a line break; the Marketplace rejects it.
          token=$(echo "$TOKEN" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "::error::JETBRAINS_MARKETPLACE_TOKEN is empty. Copy the token, then run: Get-Clipboard | gh secret set JETBRAINS_MARKETPLACE_TOKEN --repo lucaschf/riso-themes"
            exit 1
          fi
          JETBRAINS_MARKETPLACE_TOKEN="$token" ./gradlew publishPlugin --console=plain
        env:
          TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="jetbrains/build/distributions/riso-themes-jetbrains-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "JetBrains plugin $VERSION" --notes-file notes.md --latest=false "$zip"
          fi
