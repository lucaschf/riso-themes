name: Verify Marketplace token

# Run by hand (Actions → Verify Marketplace token → Run workflow) after
# changing the VSCE_PAT secret: checks it can publish, without publishing.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Shape only, never the value: a pasted token often carries a trailing
      # newline or space, which the Marketplace rejects like a wrong token.
      - name: Inspect the secret's shape
        run: |
          echo "length: ${#VSCE_PAT}"
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is empty. Copy the token, then run: Get-Clipboard | gh secret set VSCE_PAT --repo lucaschf/riso-themes"
            exit 1
          fi
          case "$VSCE_PAT" in
            *[[:space:]]*) echo "::warning::VSCE_PAT contains whitespace or a line break — re-set it with just the token." ;;
            *) echo "no whitespace" ;;
          esac
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Verify VSCE_PAT for the lucascristovam publisher
        run: npx --yes @vscode/vsce@4 verify-pat lucascristovam --pat "$(echo "$VSCE_PAT" | tr -d '[:space:]')"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
