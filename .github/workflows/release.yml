name: Release

# Push a tag that matches package.json's version (e.g. v1.3.0) to publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Open VSX (Cursor, VSCodium) is optional: skipped until the secret exists.
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build themes (fails on the contrast audit)
        run: npm run build

      - name: Check the generated files are committed
        run: |
          if ! git diff --exit-code -- themes package.json palette.json; then
            echo "::error::Generated files are out of date — run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce@4 package --out "riso-themes-$VERSION.vsix"

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --packagePath "riso-themes-$VERSION.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: env.HAS_OVSX == 'true'
        run: npx --yes ovsx publish "riso-themes-$VERSION.vsix" --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$VERSION" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "riso-themes-$VERSION.vsix" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "riso-themes-$VERSION.vsix"
          fi
